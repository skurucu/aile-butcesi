<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harcama Planı</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f0;--card:#fff;--ink:#1d2320;--mut:#6b736e;--line:#e3e1d8;--acc:#1f6f54;--neg:#c23a2b;--pos:#1f6f54;--inc:#fff3a8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a18;--card:#1e2421;--ink:#ecefed;--mut:#9aa39e;--line:#303733;--acc:#5fc79f;--neg:#ff8272;--pos:#5fc79f;--inc:#4a4416}}
:root[data-theme="dark"]{--bg:#151a18;--card:#1e2421;--ink:#ecefed;--mut:#9aa39e;--line:#303733;--acc:#5fc79f;--neg:#ff8272;--pos:#5fc79f;--inc:#4a4416}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:860px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:20px;margin:0 0 14px;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;font:inherit}
.tab.on{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}
.tab.add{color:var(--acc);border-style:dashed}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sum small{display:block;color:var(--mut);font-size:12px}
.sum b{font-size:18px;font-weight:600}
.sum .end b{font-size:22px}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar label{color:var(--mut);font-size:13px}
button.s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px}
button.s:hover{border-color:var(--acc)}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px}
td,th{border-bottom:1px solid var(--line);padding:0;text-align:left}
th{font-weight:500;color:var(--mut);font-size:12px;padding:8px 10px}
td.bal{padding:8px 10px;text-align:right;white-space:nowrap}
td.x{width:34px;text-align:center}
tr.inc td{background:var(--inc)}
input,select{font:inherit;color:inherit;background:transparent;border:0;width:100%;padding:9px 10px;border-radius:0}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-2px;background:var(--card)}
input.amt{text-align:right;width:120px}
select{cursor:pointer}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.del{background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px;padding:6px}
.del:hover{color:var(--neg)}
.new{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.new input,.new select{background:var(--card);border:1px solid var(--line);border-radius:8px;width:auto;flex:1 1 140px}
.new .a{flex:0 1 120px;text-align:right}
.go{background:var(--acc);color:var(--bg);border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.cats{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.cats h2{font-size:14px;margin:0 0 8px;font-weight:600}
.cr{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.cr .n{width:110px}.cr .t{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.cr .t i{display:block;height:100%}
.cr .v{width:90px;text-align:right}
.empty{padding:26px;text-align:center;color:var(--mut)}
.warn{background:var(--neg);color:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px;font-weight:500}
.note{color:var(--mut);font-size:13px;margin:-4px 0 10px}
tr.paid td input[data-f=name],tr.paid td input[data-f=amount]{opacity:.5;text-decoration:line-through}
summary{cursor:pointer;font-weight:600;font-size:14px}
textarea{width:100%;font:12px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
.tr{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.tr h2{font-size:14px;margin:0 0 6px;font-weight:600}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{margin:0;flex:1}
.top .note{margin:0}
:root{--sh:0 2px 10px rgba(20,30,25,.08),0 1px 2px rgba(20,30,25,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh:0 2px 14px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--sh:0 2px 14px rgba(0,0,0,.45)}
.wrap,.cats,.tr,.hero{border-radius:18px;box-shadow:var(--sh)}
.tab,button.s,.go,.new input,.new select{border-radius:12px}
.warn{border-radius:14px}
.hero{padding:18px 18px 14px;margin:14px 0;background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--acc) 16%,var(--card)));border:1px solid var(--line)}
.hero small{display:block;color:var(--mut);font-size:12px}
.hero .big{font-size:34px;font-weight:600;line-height:1.15;margin:4px 0 14px;letter-spacing:-.5px}
.hero .hr{display:flex;gap:10px}
.hero .hr div{flex:1;background:var(--card);border-radius:12px;padding:8px 12px}
.hero .hr b{font-size:16px;font-weight:600}
.donut{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.donut svg{width:170px;max-width:100%;flex:0 0 auto;margin:0 auto}
.donut .lg{flex:1 1 200px;min-width:0}
main{padding-bottom:150px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--sh);cursor:pointer}
.it.inc{background:color-mix(in srgb,var(--inc) 55%,var(--card))}
.it .ic{flex:0 0 42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px}
.it .mid{flex:1;min-width:0}
.it .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .sb,.it .bl{font-size:12px;color:var(--mut)}
.it .rt{text-align:right;white-space:nowrap}
.it .am{font-weight:600}
.it.paid .mid,.it.paid .rt{opacity:.5}
.it.paid .nm{text-decoration:line-through}
.ck,.ck0{flex:0 0 34px;height:34px}
.ck{border-radius:50%;border:1.5px solid var(--line);background:transparent;color:transparent;font-size:16px;cursor:pointer;display:grid;place-items:center;padding:0}
.ck.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:var(--bg);font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:20;padding:0}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.nb{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}
.nb span{font-size:20px;line-height:1}
.nb.on{color:var(--acc);font-weight:600}
#sheet .bd{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
#sheet .sh,#pick .sh{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:31;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
#sheet h3,#pick h3{margin:0 0 10px;font-size:16px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;padding:8px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--sh)}
#sheet input.big-in{font-size:30px;font-weight:600;text-align:center;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--bg)}
#sheet input.txt,#sheet .more input,#sheet .more select{border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.more{margin:4px 0 12px}.more summary{margin-bottom:8px;color:var(--mut);font-weight:500}
.chk{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.go.wide{width:100%;padding:13px;font-size:16px}
.row2{display:flex;gap:8px;margin-top:8px}.row2 .s{flex:1;padding:10px}
.danger{color:var(--neg)}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;z-index:40;display:flex;gap:12px;align-items:center;white-space:nowrap}
#toast.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
#toast button{background:none;border:0;color:inherit;text-decoration:underline;font:inherit;font-weight:600;cursor:pointer;padding:0}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:6px 0 10px}
.ico{aspect-ratio:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;font-size:20px;cursor:pointer;padding:0}
.ico.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.swb{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;outline:1px solid var(--line)}
.swb.on{border-color:var(--card);outline:2px solid var(--ink)}
.cprev{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:32px;margin:0 auto 12px}
.chipn{border:1px dashed var(--acc);background:transparent;color:var(--acc);border-radius:20px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
.sh .s.full{width:100%;margin-top:10px;padding:10px}
.catbtn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 12px;font:inherit;cursor:pointer;margin:0 0 10px;text-align:left}
.catbtn .cbi{flex:0 0 34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px}
.catbtn .cbn{flex:1}.catbtn .chev{color:var(--mut);font-size:20px}
.sh .x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);font-size:15px;cursor:pointer;padding:0}
#pick .bk{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50}
#pick .sh{z-index:51}
.newrow{border-style:dashed;border-color:var(--acc)}
.tot{display:flex;gap:8px;margin:8px 0}
.tot div{flex:1;background:var(--bg);border-radius:12px;padding:8px 10px}
.tot small{display:block;color:var(--mut);font-size:12px}
.tot b{font-size:15px;font-weight:600}
@media(max-width:520px){.sum{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="top"><h1>Harcama planı</h1><span id="sy" class="note"></span><button class="s" id="th" title="Tema" aria-label="Tema değiştir">◐ Tema</button></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</main>
<button class="fab" id="fab" aria-label="Kalem ekle">+</button>
<nav class="nav"><button class="nb on" data-tab="items"><span>📋</span>Kalemler</button><button class="nb" data-tab="sum"><span>📊</span>Özet</button><button class="nb" data-tab="set"><span>⚙️</span>Ayarlar</button></nav>
<div id="sheet"></div><div id="pick"></div><div id="toast"></div>
<script>
const CATS={maas:['Maaş / gelir','#e6c200'],borc:['KMH / borç','#6fb33a'],kira:['Kira','#8a6bd6'],fatura:['Fatura','#d98ad0'],gida:['Market / gıda','#f0a020'],ulasim:['Ulaşım / yakıt','#4aa8d8'],kart:['Kredi kartı','#3f78c8'],kisisel:['Kişisel','#e08a6a'],diger:['Diğer','#8a918d']};
const MN=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const KEY='harcama-plani-v1';
let uid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
function seed(){
 const o=(n,a,c)=>({id:uid(),name:n,amount:a,cat:c});
 const maas=o('MAAŞ',93000,'maas');
 return{cur:'2026-11',months:[
 {id:'2026-11',opening:0,items:[maas,o('KMH tahmini geçen ayın',-10000,'borc'),o('KİRA',-21000,'kira'),o('FATURA',-10000,'fatura'),o('EVE GIDA MARKET YEMEK',-30000,'gida'),o('TAKSİT',-7000,'kart'),o('TOMRİS',-2000,'kisisel'),o('SU',-1000,'fatura'),o('LEO MAMA TAKSİT + ZARA 6. TAKSİT',-2640,'kart'),o('SİGARA 40 AD',-5000,'kisisel'),o('KUAFÖR',-4000,'kisisel'),o('BENZİN TRAŞ METİN',-3500,'ulasim')]},
 {id:'2026-12',opening:0,items:[{...maas,id:uid()},o('KMH tahmini geçen ayın',-4000,'borc'),o('KİRA',-21000,'kira'),o('FATURA',-10000,'fatura'),o('EVE GIDA MARKET YEMEK',-30000,'gida'),o('TAKSİT',-7000,'kart'),o('TOMRİS',-2000,'kisisel'),o('SU',-1000,'fatura'),o('LEO MAMA TAKSİT',-1390,'kart'),o('SİGARA 40 AD',-5000,'kisisel'),o('KUAFÖR',-4000,'kisisel'),o('BENZİN TRAŞ METİN',-3500,'ulasim'),o('MOTOR BAKIMI tahmini',-3000,'ulasim')]}]};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.months||!S.months.length)S=seed();
S.limit=S.limit||0;S.auto=!!S.auto;S.rec=S.rec||[];
const IC={maas:'💰',borc:'🏦',kira:'🏠',fatura:'💡',gida:'🛒',ulasim:'🚗',kart:'💳',kisisel:'👤',diger:'📦'};
const CAT_DEF=JSON.parse(JSON.stringify(CATS));Object.keys(CAT_DEF).forEach(k=>CAT_DEF[k][2]=IC[k]||'🏷️');
function applyCats(){if(!S.notes)S.notes=[];if(!S.cats)S.cats=JSON.parse(JSON.stringify(CAT_DEF));['maas','diger'].forEach(k=>{if(!S.cats[k])S.cats[k]=CAT_DEF[k]});Object.keys(S.cats).forEach(k=>{if(!S.cats[k][2])S.cats[k][2]=IC[k]||'🏷️'});Object.keys(CATS).forEach(k=>delete CATS[k]);Object.assign(CATS,S.cats);S.months.forEach(m=>m.items.forEach(i=>{if(!CATS[i.cat])i.cat='diger'}));(S.rec||[]).forEach(r=>{if(!CATS[r.cat])r.cat='diger'})}
applyCats();
if(!S.mig){S.mig=1;if(!S.months.some(m=>m.id==='2026-10'))S.months.push(ekim());S.cur='2026-10'}
function ekim(){const o=(n,a,c)=>({id:uid(),name:n,amount:a,cat:c});return{id:'2026-10',opening:0,items:[o('MAAŞ',93900,'maas'),o('KMH',-18500,'borc'),o('KİRA',-21000,'kira'),o('FATURA',-7065,'fatura'),o('EVE GIDA MARKET YEMEK',-18800,'gida'),o('TAKSİT BABA',-12915,'kart'),o('TOMRİS',-2000,'kisisel'),o('SU',-1000,'fatura'),o('LEO MAMA TAKSİT KREDİ KARTI',-1390,'kart'),o('SİGARA 30 AD',-3650,'kisisel'),o('KUAFÖR',-2000,'kisisel'),o('BENZİN TRAŞ METİN',-2370,'ulasim'),o('LEO VETO',-1200,'kisisel'),o('İLAÇLAR',-100,'kisisel'),o('BARIŞ ÖDEME',-1170,'diger'),o('KK FAİZİ',-773,'kart'),o('KMH FAİZİ GEÇEN AY',-4780,'borc'),o('KART AİDAT İADE',416,'diger'),o('ÇEKİLECEK 2 KUAF 1,8 EV 700 MET',-4700,'diger')]}}
const save=()=>{S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()};
const label=id=>{const[y,m]=id.split('-');return MN[+m-1]+' '+y};
const nextId=id=>{let[y,m]=id.split('-').map(Number);m++;if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')};
const idx=()=>S.months.findIndex(m=>m.id===S.cur);
const open=i=>S.auto&&i>0?closing(i-1):S.months[i].opening;
const closing=i=>open(i)+S.months[i].items.reduce((s,x)=>s+x.amount,0);
const cls=n=>n<0?'neg':'pos';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parse(v){v=String(v).trim().replace(/\s/g,'');if(v.includes(',')){v=v.replace(/\./g,'').replace(',','.')}else if(/^-?\d{1,3}(\.\d{3})+$/.test(v)){v=v.replace(/\./g,'')}const n=parseFloat(v);return isNaN(n)?0:n}

const addM=(id,n)=>{while(n-->0)id=nextId(id);return id};
function ensure(id){let m=S.months.find(x=>x.id===id);if(!m){m={id,opening:0,items:S.rec.map(r=>({id:uid(),name:r.name,amount:r.amount,cat:r.cat,rid:r.rid}))};S.months.push(m)}return m}
function plan(){
 const g={};
 S.months.slice().sort((a,b)=>a.id<b.id?-1:1).filter(m=>m.id>=S.cur).forEach(m=>m.items.forEach(i=>{if(!i.grp)return;const x=g[i.grp]=g[i.grp]||{n:i.gn,N:i.tk[1],now:0,rest:0,sum:0};x.end=m.id;if(m.id===S.cur)x.now=i.tk[0];else{x.rest++;x.sum-=i.amount}}));
 const row=(a,b)=>`<div class='cr'><span class='n' style='width:auto;flex:1'>${a}</span><span class='v' style='width:auto'>${b}</span></div>`;
 const T=Object.values(g).map(x=>row(esc(x.n)+(x.now?` (bu ay ${x.now}/${x.N})`:''),`kalan ${x.rest} taksit, ${fmt(x.sum)}, bitiş ${label(x.end)}`)).join('');
 const R=S.rec.map(r=>row('↻ '+esc(r.name),'her ay '+fmt(r.amount))).join('');
 return(T?`<div class='cats'><h2>Taksitler</h2>${T}</div>`:'')+(R?`<div class='cats'><h2>Her ay tekrarlayanlar</h2>${R}</div>`:'')}
let ref=null,tm=null,syT='Yerel kayıt';
function setSync(t){syT=t;const e=document.getElementById('sy');if(e)e.textContent=t}
function push(){if(!ref)return;clearTimeout(tm);tm=setTimeout(()=>{ref.set({t:S.t,json:JSON.stringify(S)}).then(()=>setSync('Senkron açık'),()=>setSync('Senkron hatası'))},700)}
function adopt(d){try{const o=JSON.parse(d.json);o.t=d.t;o.limit=o.limit||0;o.auto=!!o.auto;o.rec=o.rec||[];o.mig=1;S=o;applyCats();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}catch(e){}}
async function initSync(){
 try{
  if(!window.claude)return;
  const db=await claude.use('db'),u=await claude.use('user');
  if(!db||!u)return;
  const id=await u.id();if(!id)return;
  ref=db.collection('data/users/'+id).doc('plan');
  ref.onSnapshot(s=>{
   const d=s.exists&&s.data();
   if(!d){S.t=S.t||Date.now();push();return}
   if(d.t>(S.t||0))adopt(d);else if(d.t<(S.t||0))push();
   setSync('Senkron açık')},()=>setSync('Yerel kayıt'));
 }catch(e){}
}
function compare(){
 const i=idx();if(i<1)return'';
 const sm=m=>{const o={};m.items.filter(x=>x.amount<0).forEach(x=>o[x.cat]=(o[x.cat]||0)-x.amount);return o};
 const a=sm(S.months[i-1]),b=sm(S.months[i]),ks=[...new Set([...Object.keys(a),...Object.keys(b)])];
 const f=(n,p,c)=>{const d=c-p,pc=p?Math.round(Math.abs(d)/p*100):null;const t=d===0?'aynı':pc===null?'yeni':`%${pc} ${d>0?'artış':'azalış'}`;return{d,h:`<div class='cr'><span class='n' style='flex:1;width:auto'>${n}</span><span class='v' style='width:auto'>${fmt(p)} → ${fmt(c)} <b class='${d>0?'neg':d<0?'pos':''}'>${t}</b></span></div>`}};
 const rows=ks.map(k=>f(CATS[k][0],a[k]||0,b[k]||0)).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));
 const ta=Object.values(a).reduce((s,v)=>s+v,0),tb=Object.values(b).reduce((s,v)=>s+v,0);
 if(!rows.length)return'';
 const sen=ks.filter(k=>(a[k]||0)>0&&(b[k]||0)!==a[k]).map(k=>({n:CATS[k][0],p:Math.round(Math.abs((b[k]||0)-a[k])/a[k]*100),up:(b[k]||0)>a[k]})).filter(x=>x.p>0).sort((x,y)=>y.p-x.p).slice(0,3).map(x=>`<div class='cr'>• ${x.n} geçen aya göre <b class='${x.up?'neg':'pos'}'>yüzde ${x.p} ${x.up?'arttı':'azaldı'}</b></div>`).join('');
 return`<div class='cats'><h2>${label(S.months[i-1].id)} ile karşılaştırma (gider)</h2>${sen?`<div style='margin-bottom:8px'>${sen}</div>`:''}${f('Toplam gider',ta,tb).h}${rows.map(r=>r.h).join('')}</div>`}

});
const ICONS=['🛒','🍔','☕','🍕','🍎','🥦','🍷','🚬','🚗','⛽','🚌','✈️','🏠','🛋️','💡','💧','🔥','📱','💻','📺','🎮','🎬','🎵','📚','🎓','👶','🍼','🐶','🐱','💊','🏥','💇','👕','👟','🎁','🎂','💍','🧴','🧹','🔧','🏋️','⚽','🏖️','🎟️','💳','🏦','💰','💵','📈','🧾','📦','🏷️','👤','❤️','⭐','🧸'];
const COLORS=['#e6c200','#f0a020','#e08a6a','#e5484d','#d98ad0','#8a6bd6','#3f78c8','#4aa8d8','#2a9d8f','#6fb33a','#7a5c3e','#8a918d'];
const tint=c=>`color-mix(in srgb,${c} 24%,transparent)`;
function catList(){
 document.getElementById('sheet').innerHTML=`<div class="bd"></div><div class="sh" role="dialog" aria-label="Kategoriler"><div class="grab"></div><button class="x" data-sclose="1" aria-label="Kapat">✕</button><h3>Kategoriler</h3><button class="go wide" data-cnew="1">＋ Yeni kategori</button><div class="list" style="margin-top:10px">${Object.entries(CATS).map(([k,v])=>`<div class="it" data-cedit="${k}"><div class="ic" style="background:${tint(v[1])}">${v[2]||'🏷️'}</div><div class="mid"><div class="nm">${esc(v[0])}</div></div><span style="color:var(--mut);font-size:20px">›</span></div>`).join('')}</div><button class="s full" data-cclose="1">Kapat</button></div>`}
function catEdit(k){
 const nw=k==='new',v=nw?['','#2a9d8f','🏷️']:CATS[k];CK=k;CI=v[2]||'🏷️';CC=v[1];
 document.getElementById('sheet').innerHTML=`<div class="bd"></div><div class="sh" role="dialog" aria-label="Kategori"><div class="grab"></div><button class="x" data-sclose="1" aria-label="Kapat">✕</button><h3>${nw?'Yeni kategori':'Kategoriyi düzenle'}</h3><div class="cprev" id="cprev" style="background:${tint(CC)}">${CI}</div><input class="txt" id="cname" value="${esc(v[0])}" placeholder="Kategori adı"><div class="note">Simge seç</div><div class="icons">${ICONS.map(i=>`<button type="button" class="ico ${i===CI?'on':''}" data-ico="${i}">${i}</button>`).join('')}</div><input class="txt" id="cico" placeholder="Veya kendi emojini yaz"><div class="note">Renk seç</div><div class="sw">${COLORS.map(c=>`<button type="button" class="swb ${c===CC?'on':''}" data-clr="${c}" style="background:${c}" aria-label="Renk"></button>`).join('')}</div><button class="go wide" id="csave">Kaydet</button><div class="row2"><button class="s" data-cback="1">← Geri</button>${nw||k==='maas'||k==='diger'?'':'<button class="s danger" id="cdelb">Sil</button>'}</div></div>`;
 if(nw)setTimeout(()=>{const x=document.getElementById('cname');if(x)x.focus()},60)}
function restorePend(k){
 if(!PEND)return;const p=PEND;PEND=null;openSheet();
 document.getElementById('na').value=p.a;document.getElementById('nn').value=p.n;
 const ty=document.querySelector('#sheet [data-ty="'+p.ty+'"]');if(ty)ty.click();
 if(k)setCat(k)}
document.addEventListener('click',e=>{
 const t=e.target;
 if(t.id==='catmgr'){catList();return}
 const cn=t.closest('[data-cnew]');
 if(cn){closePick();const na=document.getElementById('na');if(na&&!PEND)PEND={a:na.value,n:document.getElementById('nn').value,ty:document.getElementById('nt').value};catEdit('new');return}
 const ce=t.closest('[data-cedit]');
 if(ce){catEdit(ce.dataset.cedit);return}
 const io=t.closest('[data-ico]');
 if(io){CI=io.dataset.ico;document.getElementById('cico').value='';document.querySelectorAll('#sheet .ico').forEach(b=>b.classList.toggle('on',b===io));document.getElementById('cprev').textContent=CI;return}
 const cl=t.closest('[data-clr]');
 if(cl){CC=cl.dataset.clr;document.querySelectorAll('#sheet .swb').forEach(b=>b.classList.toggle('on',b===cl));document.getElementById('cprev').style.background=tint(CC);return}
 if(t.closest('[data-cback]')){if(PEND)restorePend();else catList();return}
 if(t.closest('[data-cclose]')){if(PEND)restorePend();else closeSheet();return}
 if(t.id==='csave'){const n=document.getElementById('cname').value.trim();if(!n){toast('Kategori adı yaz');return}const ic=[...document.getElementById('cico').value.trim()].slice(0,2).join('')||CI||'🏷️';let k=CK;if(k==='new')k='c'+uid();S.cats[k]=[n,CC,ic];applyCats();save();render();if(PEND)restorePend(k);else catList();return}
 if(t.id==='cdelb'){if(CK==='maas'||CK==='diger'||CK==='new')return;UNDO=JSON.stringify(S);delete S.cats[CK];applyCats();save();render();PEND=null;catList();toast('Kategori silindi',1);return}
});
function closePick(){document.getElementById('pick').innerHTML=''}
function openPick(){
 const c0=(document.getElementById('nc')||document.getElementById('ec')).value;
 document.getElementById('pick').innerHTML=`<div class="bk"></div><div class="sh" role="dialog" aria-label="Kategori seç"><div class="grab"></div><button class="x" data-pclose="1" aria-label="Kapat">✕</button><h3>Kategori seç</h3><div class="list" style="max-height:52vh;overflow-y:auto">${Object.entries(CATS).map(([k,v])=>`<div class="it" data-pk="${k}"><div class="ic" style="background:${tint(v[1])}">${v[2]||'🏷️'}</div><div class="mid"><div class="nm">${esc(v[0])}</div></div><span style="color:var(--acc);font-size:20px">${k===c0?'✓':''}</span></div>`).join('')}</div><div class="it newrow" data-cnew="1" style="margin-top:8px"><div class="ic" style="color:var(--acc)">＋</div><div class="mid"><div class="nm" style="color:var(--acc)">Yeni kategori</div></div></div></div>`}
document.addEventListener('click',e=>{
 const t=e.target;
 if(t.closest('[data-opick]')){openPick();return}
 const pk=t.closest('[data-pk]');
 if(pk){setCat(pk.dataset.pk);closePick();return}
 if(t.classList.contains('bk')||t.closest('[data-pclose]')){closePick();return}
 if(t.closest('[data-sclose]')){closeSheet();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('pick').innerHTML)closePick();else closeSheet()}});
let ZID=null;
function noteSheet(id){
 const n=id?(S.notes||[]).find(x=>x.id===id):null;ZID=n?n.id:null;
 const v=n?n.a:-1,seg=`<div class="seg"><button type="button" data-zt="-1" class="${v<0?'on':''}">Gider</button><button type="button" data-zt="1" class="${v>0?'on':''}">Gelir</button></div>`;
 document.getElementById('sheet').innerHTML=`<div class="bd"></div><div class="sh" role="dialog" aria-label="Not"><div class="grab"></div><button class="x" data-sclose="1" aria-label="Kapat">✕</button><h3>${n?'Notu düzenle':'Yeni not'}</h3>${seg}<input type="hidden" id="zy" value="${v<0?-1:1}"><input class="big-in" id="za" inputmode="decimal" placeholder="Tahmini tutar" value="${n?fmt(Math.abs(n.a)):''}"><input class="txt" id="zt" placeholder="Başlık (ör. Tatil, araç bakımı)" value="${n?esc(n.t):''}"><input class="txt" id="zw" placeholder="Ne zaman? (isteğe bağlı, ör. Mart 2027)" value="${n?esc(n.w||''):''}"><input class="txt" id="zd" placeholder="Not (isteğe bağlı)" value="${n?esc(n.d||''):''}"><button class="go wide" id="zsave">Kaydet</button>${n?'<div class="row2"><button class="s danger" id="zdel">Sil</button></div>':''}<button class="s full" data-sclose="1">Vazgeç</button></div>`;
 if(!n)setTimeout(()=>{const x=document.getElementById('za');if(x)x.focus()},60)
}
document.addEventListener('click',e=>{
 const t=e.target;
 if(t.id==='znew'){noteSheet();return}
 const zn=t.closest('[data-znote]');
 if(zn){noteSheet(zn.dataset.znote);return}
 const zt=t.closest('[data-zt]');
 if(zt){document.getElementById('zy').value=zt.dataset.zt;document.querySelectorAll('#sheet [data-zt]').forEach(b=>b.classList.toggle('on',b===zt));return}
 if(t.id==='zsave'){const a=Math.abs(parse(document.getElementById('za').value))*(+document.getElementById('zy').value),n=document.getElementById('zt').value.trim();if(!a||!n){toast('Başlık ve tutar gir');return}const o={t:n,a,w:document.getElementById('zw').value.trim(),d:document.getElementById('zd').value.trim()};if(ZID){const x=S.notes.find(q=>q.id===ZID);if(x)Object.assign(x,o)}else S.notes.push(Object.assign({id:uid()},o));save();closeSheet();render();return}
 if(t.id==='zdel'){UNDO=JSON.stringify(S);S.notes=S.notes.filter(q=>q.id!==ZID);save();closeSheet();render();toast('Not silindi',1);return}
});
render();setSync(syT);initSync();
</script>
</body>
</html>
